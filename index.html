<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABX PRO 2026</title>
<meta name="description" content="ABX PRO 2026 – Kháng sinh lâm sàng: Tra cứu nhanh – Đánh giá mức độ – Lựa chọn kháng sinh – Tối ưu liều điều trị.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ABX PRO"><meta name="theme-color" content="#0a7279">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>/* Layout: thanh trên dính, nội dung một cột tối đa 880px; ô chức năng dạng lưới tự xuống dòng */
:root{
 --bg:#f3f6f7;--surface:#ffffff;--surface2:#e9eff1;--fg:#13232b;--muted:#566a73;--line:#d3dde1;
 --accent:#0a7279;--accent-fg:#ffffff;--accent-soft:#d6eeef;
 --ok:#1d7a3e;--ok-bg:#e2f4e8;--warn:#8a6300;--warn-bg:#fff3cf;--hi:#b25300;--hi-bg:#ffe6d1;--crit:#b3261e;--crit-bg:#fde3e1;
 --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
 --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
 --r:14px;--alt:#1f5fbf;--alt-bg:#e1ecfb;--h1:#06535c;--h2:#0b7d84;--h3:#1d9bb4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0d1619;--surface:#152226;--surface2:#1c2d32;--fg:#e4eef0;--muted:#97aab0;--line:#2a3e44;
 --accent:#4fc1c8;--accent-fg:#06272a;--accent-soft:#163a3e;--h1:#063238;--h2:#0a5158;--h3:#106d80;--alt:#8db8ff;--alt-bg:#16294a;
 --ok:#6fd393;--ok-bg:#163526;--warn:#f1c75a;--warn-bg:#3a3014;--hi:#ffa660;--hi-bg:#3d2615;--crit:#ff8a80;--crit-bg:#401b19;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0d1619;--surface:#152226;--surface2:#1c2d32;--fg:#e4eef0;--muted:#97aab0;--line:#2a3e44;
 --accent:#4fc1c8;--accent-fg:#06272a;--accent-soft:#163a3e;--h1:#063238;--h2:#0a5158;--h3:#106d80;--alt:#8db8ff;--alt-bg:#16294a;
 --ok:#6fd393;--ok-bg:#163526;--warn:#f1c75a;--warn-bg:#3a3014;--hi:#ffa660;--hi-bg:#3d2615;--crit:#ff8a80;--crit-bg:#401b19;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:800;letter-spacing:.02em;text-decoration:none;color:var(--fg);font-size:17px;white-space:nowrap}
.brand b{color:var(--accent)}
.sp{flex:1}
.ib{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px;text-decoration:none;color:var(--fg);font-size:14px}
.ib svg{width:20px;height:20px}
.ib .cnt{background:var(--accent);color:var(--accent-fg);border-radius:99px;font-size:12px;padding:0 6px;font-weight:700}
main{max-width:880px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:24px;line-height:1.25;margin:4px 0 6px;text-wrap:balance}
h2{font-size:19px;margin:22px 0 8px;text-wrap:balance}
h3{font-size:16px;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.hero{margin:-16px calc(-1*max(16px,env(safe-area-inset-left,0px))) 8px;padding:22px max(16px,env(safe-area-inset-left,0px)) 20px;background:linear-gradient(135deg,var(--h1) 0%,var(--h2) 55%,var(--h3) 100%);color:#fff;border-radius:0 0 22px 22px}
.hero h1{font-size:30px;letter-spacing:-.01em;margin:2px 0 4px;color:#fff}
.hero .eyebrow{color:rgba(255,255,255,.82)}
.hero .lead{margin:0 0 6px;color:rgba(255,255,255,.92);font-size:15px}
.hero .search input{border-color:transparent;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.qk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qk a{color:#fff;text-decoration:none;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
.gt{border-top:4px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,var(--surface)) 0%,var(--surface) 70%)}
.gt .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.gt:hover{border-color:var(--c);border-top-color:var(--c)}
.search{display:flex;gap:8px;margin:10px 0 4px}
.search input{flex:1;min-width:0;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.search input:focus{outline:2px solid var(--accent);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;min-height:92px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);position:relative}
.tile:hover,.tile:focus-visible{border-color:var(--accent);outline:none}
.tile b{font-size:15.5px;line-height:1.3}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.35}
.tile.tool{background:var(--accent-soft);border-color:transparent}
.tile.tool b{color:var(--accent)}
.tile{box-shadow:0 1px 2px rgba(10,40,50,.06)}
.tile .n{position:absolute;top:10px;right:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);min-height:56px}
.row:hover{border-color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--muted);font-size:13px}
.chev{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{min-height:44px;padding:8px 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:14.5px;text-align:left;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.chip.sm{min-height:34px;padding:4px 10px;font-size:13px}
.step{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font-weight:700}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.card h3{margin-top:4px}
.rx{border-left:4px solid var(--accent)}
.rx ul{margin:6px 0;padding-left:20px}
.rx li{margin:4px 0}
.lbl{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.dl{display:inline;border:none;background:none;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-hi{background:var(--hi-bg);color:var(--hi)}.b-crit{background:var(--crit-bg);color:var(--crit)}
.aw-A{background:var(--ok-bg);color:var(--ok)}.aw-W{background:var(--warn-bg);color:var(--warn)}.aw-R{background:var(--crit-bg);color:var(--crit)}
.alert{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.alert.warn{background:var(--warn-bg);color:var(--fg);border-left:4px solid var(--warn)}
.alert.crit{background:var(--crit-bg);color:var(--fg);border-left:4px solid var(--crit)}
.alert.info{background:var(--accent-soft);color:var(--fg);border-left:4px solid var(--accent)}
.alert.ok{background:var(--ok-bg);color:var(--fg);border-left:4px solid var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14.5px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:10px 0}
details.acc>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;min-height:48px}
details.acc>summary::after{content:"+";float:right;color:var(--muted);font-size:20px;line-height:1}
details.acc[open]>summary::after{content:"–"}
.acc .in{padding:0 16px 14px}
.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.f,.card,details.acc,.acc .in{min-width:0}
main{overflow-wrap:break-word}
.btn svg{width:18px;height:18px;flex:none}
a.chip{text-decoration:none;color:var(--fg);display:inline-flex;align-items:center}
a.chip[aria-pressed="true"]{color:var(--accent-fg)}
.f{padding:10px 0;border-top:1px solid var(--line)}
.f:first-child{border-top:none}
.f .k{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:6px}
.f .k em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--accent);min-width:22px}
.f .v{margin-top:2px;white-space:pre-line}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.fld input[type=range]{padding:0;border:none;height:30px;accent-color:var(--accent)}
.fld .hint{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:0 12px;min-height:42px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.out{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.kv{background:var(--surface2);border-radius:10px;padding:10px 12px}
.kv small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{font-size:19px;font-variant-numeric:tabular-nums}
.kv b small{display:inline;font-size:13px}
.score-res{border-radius:12px;padding:14px 16px;margin:12px 0;font-weight:600}
.lv-g{background:var(--ok-bg);border-left:6px solid var(--ok)}.lv-y{background:var(--warn-bg);border-left:6px solid var(--warn)}.lv-o{background:var(--hi-bg);border-left:6px solid var(--hi)}.lv-r{background:var(--crit-bg);border-left:6px solid var(--crit)}
.score-res .big{font-size:30px;font-variant-numeric:tabular-nums}
.ck{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:48px;margin:6px 0}
.ck input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.ck .p{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.sel-row{margin:10px 0}
.sel-row .l{font-weight:700;font-size:14px;margin-bottom:4px}
.foot{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.disc{background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.flow{display:flex;flex-direction:column;gap:0;margin:8px 0}
.flow .node{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.flow .node.on{border-color:var(--ok);background:var(--ok-bg)}
.flow .arr{height:16px;border-left:2px solid var(--line);margin-left:22px}
.flow .node label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.flow .node input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin-top:2px}
.flow .node small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.timer{font-family:var(--f-mono);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.mt0{margin-top:0}
.fav[aria-pressed="true"] svg{fill:var(--warn);stroke:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:120px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:10px;font-family:var(--f-mono);font-size:13px}
.abg input{width:64px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right;padding:0 6px;font-variant-numeric:tabular-nums}
.abg td.low{background:var(--crit-bg)}.abg td.mid{background:var(--warn-bg)}.abg td.good{background:var(--ok-bg)}
@media (max-width:520px){h1{font-size:21px}.hero h1{font-size:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:84px;padding:12px}.brand{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.actions,.noprint,.toast,.search{display:none!important}body{background:#fff;color:#000}main{max-width:none}.card,details.acc{border-color:#999;break-inside:avoid}details.acc>.in{display:block}}

/* ===== v2: tab, thẻ, bảng phác đồ, màu ngữ nghĩa ===== */
.ib.mode{font-weight:700;font-size:13px;padding:0 10px;background:var(--accent-soft);color:var(--accent);border-color:transparent}
#npBtn{font-weight:700;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin:10px 0}
.cards.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ic{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;margin:10px 0}
.cards .ic{margin:0}
.ich{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.ic.k-main{border-left-color:var(--accent)}.ic.k-pref{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 55%,var(--surface))}.ic.k-alt{border-left-color:var(--alt);background:color-mix(in srgb,var(--alt-bg) 55%,var(--surface))}.ic.k-caut{border-left-color:var(--hi);background:color-mix(in srgb,var(--hi-bg) 55%,var(--surface))}.ic.k-crit{border-left-color:var(--crit);background:color-mix(in srgb,var(--crit-bg) 55%,var(--surface))}.ic.k-ref{border-left-color:var(--muted);background:var(--surface2)}
ul.bl{margin:0;padding-left:18px}ul.bl li{margin:3px 0}
.big2{font-size:20px;font-weight:800;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.s-pref{background:var(--ok)}.s-alt{background:var(--alt)}.s-caut{background:var(--hi)}.s-crit{background:var(--crit)}.s-ref{background:var(--muted)}
.wz .step{margin-top:16px}
.qrow{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.qrow .ql{font-weight:700;font-size:14px;padding-top:8px}
.chip.none[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.rx-t td.pa{font-weight:800;font-size:13px}
table.rt tr.r-pref td{background:color-mix(in srgb,var(--ok-bg) 70%,var(--surface))}
table.rt tr.r-pref td.pa{color:var(--ok);border-left:5px solid var(--ok)}
table.rt tr.r-alt td{background:color-mix(in srgb,var(--alt-bg) 70%,var(--surface))}
table.rt tr.r-alt td.pa{color:var(--alt);border-left:5px solid var(--alt)}
table.rt tr.r-caut td{background:color-mix(in srgb,var(--hi-bg) 70%,var(--surface))}
table.rt tr.r-caut td.pa{color:var(--hi);border-left:5px solid var(--hi)}

table.rt tr.r-ref td.pa{border-left:5px solid var(--muted);text-decoration:none}
table.rt tr.full td{font-size:13px;color:var(--muted);padding-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px;margin:2px 2px 2px 0;line-height:1.35}
.t-caut{background:var(--hi-bg);color:var(--hi)}.t-crit{background:var(--crit-bg);color:var(--crit)}
td.hl{background:var(--hi-bg)!important}
.f.fr-pref{border-left:4px solid var(--ok);padding-left:10px}.f.fr-caut{border-left:4px solid var(--hi);padding-left:10px}.f.fr-crit{border-left:4px solid var(--crit);padding-left:10px}.f.fr-ref{border-left:4px solid var(--line);padding-left:10px}
table.spec th{font-size:11px;text-transform:none;letter-spacing:0;white-space:nowrap}
table.spec td{text-align:center;font-size:16px}
table.spec td:first-child{text-align:left;font-size:14px;white-space:nowrap}
table.spec.big td:nth-child(2){text-align:center}
table.spec tr.grp td{background:var(--surface2);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;text-align:left;color:var(--muted)}
.sp-y{color:var(--ok)}.sp-m{color:var(--hi)}.sp-n{color:var(--line)}
td.sp-y{background:color-mix(in srgb,var(--ok-bg) 60%,transparent)}
.minispec{display:flex;flex-direction:column;gap:2px;font-size:13px}
.cbx{width:22px;height:22px;accent-color:var(--accent);flex:none}
.row.ref{background:var(--surface2)}
.alert ul{margin:6px 0 0;padding-left:18px}
@media (max-width:720px){

dz({id:'dfi',n:'Nhiễm trùng bàn chân đái tháo đường',ref:['iwgdf-2023','idsa-ssti-2014'],

 {n:'Vừa (độ 3)',d:'Ban đỏ >2 cm hoặc mô sâu (áp xe, viêm cân, viêm khớp/xương), không SIRS.',rx:['Ampicillin/sulbactam 3 g TM mỗi 6 giờ HOẶC ceftriaxone 2 g TM mỗi 24 giờ + metronidazole 500 mg mỗi 8 giờ.'],alt:['Amoxicillin/clavulanate 1,2 g TM mỗi 8 giờ.','Thiếu máu chi/hoại tử: piperacillin/tazobactam 4,5 g mỗi 6 giờ.'],al:DEF.al,dur:'1–2 tuần (mô mềm); 6 tuần nếu viêm xương không cắt lọc.'},

dz({id:'bsi-unknown',n:'Nhiễm khuẩn huyết chưa rõ ổ nhiễm',ref:['ssc-2026','ssc-2021','idsa-amr-2024','merino'],part:true,

dz({id:'meningitis',n:'Viêm màng não',ref:['idsa-mening-2004','escmid-mening-2016'],
 def:'Viêm màng não mủ do vi khuẩn – cấp cứu nội khoa.',dx:'Sốt, đau đầu, cổ cứng, rối loạn ý thức; dịch não tủy: bạch cầu đa nhân tăng, protein tăng, glucose giảm (tỷ DNT/máu <0,4), Gram/cấy/PCR. CT sọ trước chọc dò nếu: suy giảm miễn dịch, tiền sử thần kinh trung ương, co giật mới, phù gai, GCS <10/dấu thần kinh khu trú – nhưng KHÔNG trì hoãn kháng sinh.',
 bg:'Người lớn: S. pneumoniae, N. meningitidis, Streptococcus suis (Việt Nam: liên quan ăn tiết canh/tiếp xúc lợn), Listeria (>50 tuổi/suy giảm miễn dịch), H. influenzae; sau phẫu thuật thần kinh: S. aureus, CoNS, Gram âm (Acinetobacter, Pseudomonas, Klebsiella). Loại trừ lao màng não, Cryptococcus.',
 sev:'GCS, co giật, sốc, phù não.',opd:'Không.',adm:'Cấp cứu.',icu:'GCS ≤8, sốc, co giật liên tục.',labs:'Dịch não tủy (tế bào, protein, glucose, Gram, cấy, PCR, AFB/Xpert, mực tàu/kháng nguyên Cryptococcus), cấy máu, CTM, CRP/PCT, điện giải, đông máu, CT sọ khi có chỉ định.',cx:'Cấy máu NGAY; chọc dò tủy sống nếu không chống chỉ định. Kháng sinh không chờ CT/chọc dò quá 1 giờ.',
 lv:[{n:'Cộng đồng, 18–50 tuổi, miễn dịch bình thường',d:'',rx:['Dexamethasone 0,15 mg/kg (10 mg) TM mỗi 6 giờ × 4 ngày, bắt đầu trước/cùng liều kháng sinh đầu (ngừng nếu không phải phế cầu/ S. suis/ H. influenzae).','Ceftriaxone 2 g TM mỗi 12 giờ + vancomycin 15–20 mg/kg TM mỗi 8–12 giờ (liều nạp 25–30 mg/kg nếu nặng; đáy mục tiêu 15–20 mg/L theo IDSA 2004).'],alt:['Cefotaxime 2 g TM mỗi 4–6 giờ thay ceftriaxone.'],al:{m:'Ceftriaxone thường dùng được; theo dõi.',s:'Vancomycin + moxifloxacin 400 mg mỗi 24 giờ (hoặc chloramphenicol 1 g mỗi 6 giờ nếu có) + TMP-SMX 5 mg/kg mỗi 6–8 giờ (TMP) để phủ Listeria khi cần; hội chẩn truyền nhiễm.'},dur:'Phế cầu 10–14 ngày; não mô cầu 7 ngày; H. influenzae 7 ngày; S. suis 10–14 ngày.'},
 {n:'>50 tuổi, nghiện rượu, suy giảm miễn dịch, thai',d:'Phủ thêm Listeria.',rx:['Ceftriaxone 2 g TM mỗi 12 giờ + vancomycin (như trên) + ampicillin 2 g TM mỗi 4 giờ.','Dexamethasone 10 mg TM mỗi 6 giờ × 4 ngày.'],al:{m:DEF.al.m,s:'Vancomycin + moxifloxacin + TMP-SMX 5 mg/kg mỗi 6–8 giờ (phủ Listeria).'},dur:'Listeria ≥21 ngày.'},
 {n:'Sau phẫu thuật thần kinh/chấn thương sọ não/dẫn lưu não thất',d:'',rx:['Vancomycin (AUC/đáy 15–20 mg/L) + cefepime 2 g TM mỗi 8 giờ HOẶC ceftazidime 2 g TM mỗi 8 giờ HOẶC meropenem 2 g TM mỗi 8 giờ.','CRAB/Gram âm kháng carbapenem: colistin TM + colistin tiêm trong não thất (theo hội chẩn).'],al:DEF.al,dur:'Gram âm 10–14 ngày (IDSA 2017 viêm não thất/màng não liên quan chăm sóc y tế; 21 ngày theo một số hướng dẫn cũ); tụ cầu 10–14 ngày (theo đáp ứng).'},
 {n:'Streptococcus suis (Việt Nam)',d:'Tiếp xúc lợn/ăn tiết canh, điếc, sốc, ban xuất huyết.',rx:['Ceftriaxone 2 g TM mỗi 12 giờ (± vancomycin tới khi có kháng sinh đồ) + dexamethasone 0,4 mg/kg TM mỗi 12 giờ × 4 ngày (phác đồ thử nghiệm tại Việt Nam, Mai và cs. NEJM 2007 – giảm di chứng điếc).'],al:DEF.al,dur:'10–14 ngày.'}],
 rk:['crab'],dur:'Theo tác nhân: não mô cầu 7 ngày; H. influenzae 7 ngày; phế cầu 10–14 ngày; Listeria ≥21 ngày; Gram âm 21 ngày.',renal:'Không giảm liều ceftriaxone; meropenem/cefepime/vancomycin chỉnh theo CrCl nhưng duy trì mục tiêu nồng độ cao cho thần kinh trung ương.',sw:'Không chuyển uống thường quy.',de:'Theo Gram/cấy/PCR; phế cầu nhạy ceftriaxone (MIC ≤0,5): ngừng vancomycin.',sc:'Dẫn lưu ổ mủ/ tháo dẫn lưu não thất nhiễm trùng; dự phòng tiếp xúc não mô cầu (ciprofloxacin 500 mg uống liều đơn hoặc ceftriaxone 250 mg IM).'});

/* phân tích dòng phác đồ thành từng thuốc */
function parseLine(text){
 const hits=findDrugs(text).filter(h=>!/(thay|thay the|ngoai|khong dung)\s*$/.test(norm(text.slice(Math.max(0,h.i-12),h.i))));if(!hits.length)return [{txt:text}];
 return hits.map((h,i)=>{const seg=text.slice(h.i,i+1<hits.length?hits[i+1].i:text.length);const dr=DRUG_BY_ID[h.id];
  const dose=(seg.match(/(\d[\d.,]*(?:\s?[–-]\s?\d[\d.,]*)?(?:\/\d[\d.,]*)?\s?(?:g|mg\/kg|mg|MIU|MU|triệu IU|UI)(?![a-zà-ỹ])(?:\/ngày)?)/)||[])[1]||'';
  let route=(seg.match(/TM\/uống|uống\/TM|\b(TM|IM)\b|uống|khí dung|thụt/)||[])[0]||'';
  const conn=norm(text.slice(i?hits[i-1].i+hits[i-1].len:0,h.i));const cj=i===0?'':/hoac/.test(conn)?'hoặc':(/\+|phoi hop|kem|them/.test(conn)?'phối hợp':'');
  const iv=(seg.match(/mỗi\s\d+(?:[–-]\d+)?\s?giờ|liều (?:duy nhất|đơn)|×\s?\d+[–-]?\d*\s?liều/)||[])[0]||'';
  const dur=(seg.match(/×\s?\d+(?:[–-]\d+)?\s?(?:ngày|tuần)/)||[])[0]||'';
  if(!route&&dr)route=/^Uống$/.test(dr.route)?'uống':'';
  let inf='—';if(route==='TM'&&dr&&dr.inf){inf=/kéo dài/.test(seg)?'Kéo dài ('+(dr.id==='meropenem'?'3 giờ':'3–4 giờ')+')':(dr.inf.maxRate?'≥'+dr.inf.t+' phút (≤'+dr.inf.maxRate+' mg/phút)':dr.inf.t+' phút');}
  else if(route==='uống')inf='Không áp dụng';
  return {id:h.id,name:dr?dr.n:'',dose,route:route.replace('TM/uống','TM hoặc uống').replace(/^TM$/,'Tĩnh mạch'),iv,inf,dur,seg,cj};
 }).map((c,i,arr)=>{if(!c.route&&i>0&&c.cj==='hoặc'&&arr[i-1].route)c.route=arr[i-1].route;return c;});
}
function rxRows(lines,cls,label,lvDur){
 let rows='';lines.forEach((ln,k)=>{const comps=parseLine(ln);const pa=label+(lines.length>1?' '+(k+1):'');
  comps.forEach((p,i)=>{
   if(!p.id){rows+='<tr class="'+cls+'"><td data-l="Tình huống">'+esc(pa)+'</td><td colspan="7" data-l="Nội dung">'+linkify(p.txt)+'</td></tr>';return;}
   const w=warnings([p.id]).filter(x=>x[0]!=='info'&&!/cần chỉnh liều theo CrCl/.test(x[1]));
   rows+='<tr class="'+cls+'">'+(i===0?'<td data-l="Tình huống" rowspan="'+comps.length+'" class="pa">'+esc(pa)+'</td>':'')+
   '<td data-l="Kháng sinh"><a class="dl" href="#drug-'+p.id+'">'+esc(p.name)+'</a>'+(p.cj?' <span class="badge '+(p.cj==='hoặc'?'b-alt':'b-comb')+'">'+p.cj+'</span>':'')+'</td><td data-l="Liều người lớn">'+esc(p.dose||'xem dòng phác đồ')+'</td><td data-l="Đường dùng">'+esc(p.route||'—')+'</td><td data-l="Khoảng cách">'+esc(p.iv||'—')+'</td><td data-l="Thời gian truyền">'+esc(p.inf)+'</td><td data-l="Thời gian điều trị">'+esc(p.dur||'Xem dưới bảng')+'</td><td data-l="Lưu ý">'+(renalCell(p.id))+(w.length?w.map(x=>'<span class="tag '+(x[0]==='crit'?'t-crit':'t-caut')+'">'+esc(x[1].replace(/^[^:]+:\s*/,''))+'</span>').join(''):'')+(renalCell(p.id)||w.length?'':'—')+'</div></td></tr>';
  });
  if(S.mode==='deep'||comps.length>1)rows+='<tr class="full '+cls+'"><td colspan="8" data-l="">'+linkify(ln)+'</td></tr>';
 });return rows;
}
function renalCell(id){
 const dr=DRUG_BY_ID[id];if(!dr)return '';const a=S.ans.renal?renalState():null;
 if(a==='hd')return '<span class="tag t-caut">Lọc máu: '+esc(dr.hd)+'</span>';
 if(a==='crrt')return '<span class="tag t-caut">CRRT: '+esc(dr.crrt)+'</span>';
 if(a==='low'){const r=ptCalc();if(r.crcl!=null){const b=band(dr,r.crcl);if(b===dr.renal[0])return '<span class="tag t-ok">CrCl '+fmt(r.crcl,0)+': không cần chỉnh</span>';return '<span class="tag t-caut">CrCl '+fmt(r.crcl,0)+': '+esc(b[2])+'</span>';}return dr.renal.length>1?'<span class="tag t-caut">Cần chỉnh theo CrCl – nhập creatinin</span>':'';}
 return '';
}
function renderRx(id){

 const lv=d.lv[sel.lv];const al=lv.al||DEF.al;const a=S.ans.allergy;
 const altNames=[...new Set(drugsIn((lv.alt||[]).join(' ')))].map(x=>DRUG_BY_ID[x].n).join(', ');

 if(a==='anaph'){rows+=rxRows([al.s],'r-pref','Phác đồ ưu tiên (phản vệ β-lactam)');rows+=rxRows(lv.rx,'r-ref','Phác đồ chuẩn – có β-lactam, KHÔNG dùng');}
 else{rows+=rxRows(lv.rx,'r-pref','Phác đồ ưu tiên');if(a==='mild')rows+=rxRows([al.m],'r-caut','Khi dị ứng penicillin không nặng');}
 if(lv.alt&&lv.alt.length)rows+=rxRows(lv.alt,'r-alt','Phác đồ thay thế');
 (d.rk||[]).forEach(k=>{if(sel.rk[k])rows+=rxRows(RK[k].rx,'r-caut','Nguy cơ: '+RK[k].n.replace(/^Nguy cơ /,''));});
 let h=legendHTML()+'<div class="tw"><table class="rt rx-t"><thead><tr><th>Tình huống</th><th>Kháng sinh</th><th>Liều người lớn</th><th>Đường dùng</th><th>Khoảng cách</th><th>Thời gian truyền</th><th>Thời gian điều trị</th><th>Lưu ý</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
 h+='<div class="cards">'+infoCard('Thời gian điều trị',bullets(lv.dur||d.dur),'k-main')+(altNames?infoCard('Kháng sinh thay thế',bullets(altNames),'k-alt'):'')+'</div>';
 (d.rk||[]).forEach(k=>{if(sel.rk[k]&&RK[k].nt)h+='<div class="alert warn"><b>'+esc(RK[k].n)+':</b> '+esc(RK[k].nt)+'</div>';});
 if(lv.nt)h+='<div class="alert info">'+linkify(lv.nt)+'</div>';
 if(d.sc)h+='<div class="alert crit"><b>Kiểm soát ổ nhiễm:</b> '+esc(d.sc)+'</div>';
 const ids=drugsIn([al.s,al.m].concat(lv.rx,lv.alt||[],...(d.rk||[]).filter(k=>sel.rk[k]).map(k=>RK[k].rx)).join(' '));
 const w=warnings(ids);if(w.length)h+='<details class="acc"'+(w.some(x=>x[0]==='crit')?' open':'')+'><summary>Cảnh báo theo bệnh nhân ('+w.length+')</summary><div class="in">'+warnHTML(w)+'</div></details>';
 if(d.matrix)h+='<details class="acc"><summary>Bảng lựa chọn theo ổ nhiễm</summary><div class="in">'+matrixHTML()+'</div></details>';
 h+='<div class="disc">Gợi ý điều trị theo kinh nghiệm cho người lớn; không phải đơn thuốc. Đối chiếu kháng sinh đồ tích lũy của bệnh viện (chọn thuốc nhạy ≥80% khi nhiễm khuẩn huyết, ≥90% khi sốc – IDSA 2025).</div>';
 o.innerHTML=h;
}
function regimenText(id){

function ptCalc(){
 const p=S.pt;let w=parseFloat(p.w),h=parseFloat(p.h),age=parseFloat(p.age);let scr=parseFloat(p.scr);
 const r={warn:[]};
 if(p.w!==''&&!(w>=1&&w<=400)){r.warn.push(['crit','Cân nặng không hợp lệ ('+p.w+' kg) – kiểm tra lại.']);w=NaN;}

 if(p.age!==''&&!(age>=0&&age<=120)){r.warn.push(['crit','Tuổi không hợp lệ ('+p.age+').']);age=NaN;}
 if(p.scr!==''){const mg=p.unit==='umol'?scr/88.4:scr;if(!(mg>=0.1&&mg<=20)){r.warn.push(['crit','Creatinin không hợp lệ ('+p.scr+' '+(p.unit==='umol'?'µmol/L':'mg/dL')+') – kiểm tra đơn vị.']);scr=NaN;}}
 r.w=w;r.h=h;r.age=age;
 if(!(w>0))r.warn.push(['crit','Thiếu cân nặng: không tính được liều theo kg.']);
 if(h>0){r.ibw=(p.sex==='f'?45.5:50)+0.9*(h-152.4);r.bmi=w/Math.pow(h/100,2);if(r.ibw<20)r.ibw=null;}
 else r.warn.push(['warn','Thiếu chiều cao: không tính được cân nặng lý tưởng (IBW)/BMI – CrCl dùng cân nặng thực, có thể sai ở người béo phì.']);
 if(r.ibw)r.abw=r.ibw+0.4*(w-r.ibw);
 let cgW=w,cgL='cân nặng thực';
 if(r.ibw&&w>0){if(w<r.ibw){cgW=w;cgL='cân nặng thực (< IBW)';}else if(w>1.2*r.ibw){cgW=r.abw;cgL='cân nặng điều chỉnh (béo phì)';}else{cgW=r.ibw;cgL='cân nặng lý tưởng';}}
 if(scr>0){const mg=p.unit==='umol'?scr/88.4:scr;r.scrmg=mg;if(age>0&&cgW>0){r.crcl=(140-age)*cgW/(72*mg)*(p.sex==='f'?0.85:1);r.cgL=cgL;}if(mg<0.7&&age>=65)r.warn.push(['warn','Creatinin thấp ở người cao tuổi/ít cơ: CrCl có thể bị ước tính quá cao.']);}
 if(r.scrmg&&age>0){const f=p.sex==='f',k=f?0.7:0.9,al=f?-0.241:-0.302,x=r.scrmg/k;r.egfr=142*Math.pow(Math.min(x,1),al)*Math.pow(Math.max(x,1),-1.2)*Math.pow(0.9938,age)*(f?1.012:1);}
 if(parseFloat(p.crcl)>0){r.crcl=parseFloat(p.crcl);r.cgL='nhập trực tiếp';}
 if(p.liver==='c')r.warn.push(['warn','Suy gan Child-Pugh C: kiểm tra mục Suy gan của từng thuốc (metronidazole, tigecycline, cefoperazone/sulbactam…).']);
 if(r.crcl==null&&p.mode==='none')r.warn.push(['crit','Thiếu creatinin/tuổi hoặc CrCl: chưa xác định được mức chỉnh liều thận.']);
 if(!(age>0))r.warn.push(['warn','Thiếu tuổi.']);
 if(age>0&&age<18)r.warn.push(['crit','Bệnh nhân <18 tuổi: công thức và liều trong ứng dụng dành cho người lớn – không áp dụng.']);
 if(w>0&&(w<40))r.warn.push(['warn','Cân nặng thấp (<40 kg): nguy cơ quá liều với liều cố định; ưu tiên liều theo kg và TDM.']);
 if(w>150||w<30)r.warn.push(['warn','Cân nặng ngoài khoảng 30–150 kg: kiểm tra lại số liệu; dữ liệu dược động học hạn chế.']);
 if(r.bmi>=30)r.warn.push(['warn','Béo phì (BMI '+fmt(r.bmi,1)+'): aminoglycoside dùng cân nặng điều chỉnh; vancomycin liều nạp theo cân nặng thực (tối đa ~3 g), theo dõi AUC.']);
 if(p.unstable)r.warn.push(['crit','Chức năng thận không ổn định (AKI/đang hồi phục): Cockcroft–Gault không tin cậy. Ngày đầu thường dùng liều đầy đủ cho kháng sinh có khoảng điều trị rộng (β-lactam), theo dõi creatinin/nồng độ thuốc, đánh giá lại mỗi 24 giờ.']);
 if(p.mode==='crrt'){const e=parseFloat(p.eff)||0;if(w>0&&e>0){r.crrtCl=e*w/60;}else r.warn.push(['warn','Thiếu liều dịch thải CRRT (mL/kg/giờ) hoặc cân nặng.']);}

function band(d,cl){return d.renal.find(b=>cl>=b[0]&&cl<b[1])||d.renal[0];}
const rng=(a,b,u,round)=>{const R=x=>round?Math.round(x/round)*round:x,F=x=>round?Math.max(round,Math.floor(x/round)*round):x;return a===b?fmt(R(a))+' '+u:fmt(R(a))+'–'+fmt(Math.max(R(a),F(b)))+' '+u;};
function doseCalc(d,r){
 const o=[];const c=d.calc||{};const p=S.pt;
 const wBasis=c.basis==='adj'&&r.abw&&r.w>1.2*r.ibw?r.abw:c.basis==='ibw'&&r.ibw?r.ibw:r.w;
 const wLbl=c.basis==='adj'&&r.abw&&r.w>1.2*r.ibw?'cân nặng điều chỉnh '+fmt(r.abw,1)+' kg':'cân nặng thực '+fmt(r.w,1)+' kg';
 const round=d.id==='vancomycin'?250:(d.id==='amikacin'?25:(d.id==='gentamicin'?10:(d.id==='teicoplanin'?50:(d.id==='daptomycin'?50:10))));
 if(c.special==='colistin'){
  const bw=Math.min(r.w||0,r.ibw||r.w||0);
  if(bw>0){let ld=Math.min(300,2.5*2*bw);o.push(['Liều nạp',fmt(ld)+' mg CBA ≈ '+fmt(ld/33,1)+' MIU','Công thức đồng thuận 2019: Css 2,5 mg/L × 2,0 × cân nặng ('+fmt(bw,1)+' kg, lấy thấp hơn giữa IBW và thực), tối đa 300 mg CBA.']);}
  const cl=p.mode==='crrt'?null:r.crcl;
  if(p.mode==='hd')o.push(['Duy trì (HD)','Ngày không lọc: 130 mg CBA/ngày (≈4 MIU) chia mỗi 12 giờ; ngày lọc: thêm 40–50 mg CBA sau lọc (đồng thuận 2019)','Cần thẩm định.']);
  else if(p.mode==='crrt')o.push(['Duy trì (CRRT)','≈440 mg CBA/ngày (≈13 MIU) chia mỗi 8–12 giờ theo đồng thuận 2019','Cần thẩm định, tham vấn dược sĩ.']);
  else if(cl!=null){let m=Math.min(360,2.5*(1.5*cl+30));o.push(['Duy trì','≈'+fmt(m)+' mg CBA/ngày (≈'+fmt(m/33,1)+' MIU/ngày), chia mỗi 12 giờ = '+fmt(m/2)+' mg CBA (≈'+fmt(m/66,1)+' MIU) mỗi 12 giờ','Css 2,5 × (1,5 × CrCl + 30); tối đa 360 mg CBA/ngày; bắt đầu 12–24 giờ sau liều nạp.']);}
  return o;
 }
 if(c.load&&r.w>0){const lw=r.w;let a=c.load.kg[0]*lw,b=c.load.kg[1]*lw;if(c.load.max){a=Math.min(a,c.load.max);b=Math.min(b,c.load.max);}o.push(['Liều nạp',rng(a,b,c.load.unit,round)+(c.load.note?' '+c.load.note:''),c.load.kg.join('–')+' mg/kg × cân nặng thực'+(c.load.max?'; tối đa '+fmt(c.load.max)+' mg':'')]);}
 if(c.maint&&wBasis>0){o.push(['Liều theo kg',rng(c.maint.kg[0]*wBasis,c.maint.kg[1]*wBasis,c.maint.unit,round)+' '+c.maint.int,c.maint.kg.join('–')+' mg/kg × '+wLbl]);}
 return o;
}

function customRes(k,c){
 c=c.c;
 if(k==='iwgdf'){const o=c.osteo?' (O)':'';if(!c.loc&&!c.ery&&!c.deep&&!c.sirs)return['g','Độ 1 – Không nhiễm trùng'+o,'Không dùng kháng sinh cho vết loét không nhiễm trùng.'];if(c.sirs)return['r','Độ 4 – Nặng'+o,'Nhập viện, kháng sinh TM phổ rộng, hội chẩn ngoại khoa khẩn.'];if(c.ery||c.deep)return['o','Độ 3 – Vừa'+o,'Thường nhập viện (tùy), đánh giá phẫu thuật, thiếu máu chi.'];return['y','Độ 2 – Nhẹ'+o,'Có thể điều trị ngoại trú kháng sinh uống 1–2 tuần.'];}
 if(k==='tgcc'||k==='tgca'){if(!c.dx)return['y','Chưa xác nhận chẩn đoán','Đánh dấu tiêu chuẩn chẩn đoán trước khi phân độ.'];const III=Object.keys(c).some(x=>x.startsWith('III_')&&c[x]);const nII=Object.keys(c).filter(x=>x.startsWith('II_')&&c[x]).length;
  if(III)return['r','Độ III – Nặng','Hồi sức, kháng sinh ngay, '+(k==='tgca'?'dẫn lưu mật cấp cứu.':'dẫn lưu túi mật/ phẫu thuật khi ổn định ở trung tâm đủ điều kiện.')];
  if(k==='tgcc'?nII>=1:nII>=2)return['o','Độ II – Vừa',k==='tgca'?'Dẫn lưu mật sớm (24–48 giờ).':'Cắt túi mật nội soi sớm ở trung tâm có kinh nghiệm hoặc dẫn lưu.'];
  return['g','Độ I – Nhẹ',k==='tgca'?'Kháng sinh; dẫn lưu nếu không đáp ứng sau 24 giờ.':'Cắt túi mật nội soi sớm.'];}
 if(k==='ssti'){if(c.nf)return['r','Nghi viêm cân mạc hoại tử','Hội chẩn ngoại khoa CẤP CỨU, kháng sinh phổ rộng.'];if(c.hypo||c.fail||c.immuno||(c.sys&&c.type==='p'&&c.fail))return['r','Nặng','Kháng sinh TM (vancomycin + phổ rộng tùy tình huống), nhập viện.'];if(c.sys)return['o','Vừa','Kháng sinh '+(c.type==='p'?'+ rạch dẫn lưu; TMP-SMX/doxycycline hoặc TM':'TM hoặc uống tùy lâm sàng')+'.'];return['g','Nhẹ',c.type==='p'?'Rạch dẫn lưu; thường không cần kháng sinh.':'Kháng sinh uống (cephalexin).'];}
 return['y','—',''];
}

const ABG_ORG=[['ecoli','E. coli'],['kpn','K. pneumoniae'],['pa','P. aeruginosa'],['ab','A. baumannii'],['sa','S. aureus']];
const ABG_DRUG=['Ceftriaxone','Cefepime','Pip/tazo','Meropenem','Levofloxacin','Amikacin','Colistin','Cotrimoxazole','Oxacillin','Vancomycin'];

 const form=S.form||DRUGS.map(d=>d.id);
 const ab=store.get('abgT',{});
 let h='<a class="btn" href="#home">'+ICON.back+' Trang chủ</a><h1>Dữ liệu bệnh viện</h1><p class="sub">Danh mục thuốc hiện có và kháng sinh đồ tích lũy (% nhạy). Lưu trên thiết bị này.</p>'+
 '<h2>Danh mục thuốc</h2><div class="actions"><button class="btn" id="fall">Chọn tất cả</button><button class="btn" id="fnone">Bỏ tất cả</button></div><div class="chips" id="fm">'+DRUGS.map(d=>'<button class="chip sm" data-d="'+d.id+'" aria-pressed="'+form.includes(d.id)+'">'+esc(d.n)+'</button>').join('')+'</div>'+
 '<h2>Kháng sinh đồ tích lũy (% nhạy)</h2><p class="muted">Ô đỏ <80%, vàng 80–89%, xanh ≥90% (IDSA 2025: sepsis ≥80%, sốc ≥90%).</p><div class="tw abg"><table><thead><tr><th>Vi khuẩn</th>'+ABG_DRUG.map(x=>'<th class="num">'+x+'</th>').join('')+'</tr></thead><tbody>'+
 ABG_ORG.map(o=>'<tr><th>'+o[1]+'</th>'+ABG_DRUG.map(x=>{const v=(ab[o[0]]||{})[x];const cls=v===''||v==null?'':v<80?'low':v<90?'mid':'good';return '<td class="'+cls+'"><input type="number" min="0" max="100" inputmode="numeric" data-o="'+o[0]+'" data-x="'+x+'" value="'+(v==null?'':v)+'" aria-label="'+o[1]+' '+x+'"></td>';}).join('')+'</tr>').join('')+'</tbody></table></div>'+
 '<h3>Sao lưu / chuyển dữ liệu</h3><textarea id="exp" aria-label="Dữ liệu JSON">'+esc(JSON.stringify({form:S.form,abgT:ab}))+'</textarea><div class="actions"><button class="btn" id="cp">Sao chép JSON</button><button class="btn" id="imp">Nhập JSON đã dán</button></div>';
 shell(h);
 $('#fm').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const id=b.dataset.d;let f=S.form||DRUGS.map(d=>d.id);f=f.includes(id)?f.filter(x=>x!==id):f.concat(id);S.form=f;save('form');b.setAttribute('aria-pressed',f.includes(id));};
 $('#fall').onclick=()=>{S.form=null;save('form');hospital();};$('#fnone').onclick=()=>{S.form=[];save('form');hospital();};
 document.querySelector('.abg').oninput=e=>{const i=e.target;if(!i.dataset.o)return;const t=store.get('abgT',{});t[i.dataset.o]=t[i.dataset.o]||{};const v=i.value===''?null:Math.max(0,Math.min(100,+i.value));if(v==null)delete t[i.dataset.o][i.dataset.x];else t[i.dataset.o][i.dataset.x]=v;store.set('abgT',t);const td=i.parentNode;td.className=v==null?'':v<80?'low':v<90?'mid':'good';syncAbg(t);};
 $('#cp').onclick=()=>copyText($('#exp').value);
 $('#imp').onclick=()=>{try{const j=JSON.parse($('#exp').value);if('form' in j){S.form=j.form;save('form');}if(j.abgT){store.set('abgT',j.abgT);syncAbg(j.abgT);}toast('Đã nhập dữ liệu');hospital();}catch(e){toast('JSON không hợp lệ – kiểm tra lại nội dung đã dán');}};
}
function syncAbg(t){const map={ecoli:'esbl',kpn:'cre',pa:'pseudo',ab:'acin',sa:'mrsa'};S.abg={};Object.entries(t).forEach(([o,v])=>{const lab=ABG_ORG.find(x=>x[0]===o)[1];const k=map[o];S.abg[k]=S.abg[k]||{};Object.entries(v).forEach(([d,p])=>S.abg[k][lab+' – '+d]=p);});save('abg');}

function sepsis(){
 const p=S.pt;const sp=S.sep;
 let h='<a class="btn" href="#home">'+ICON.back+' Trang chủ</a><h1>Hồi sức nhiễm khuẩn huyết</h1><p class="sub">Quy trình tương tác theo Surviving Sepsis Campaign 2026 (đối chiếu một phần) và 2021.</p>'+
 '<div class="card"><div class="eyebrow">Thời gian từ khi nhận diện (T0)</div><div class="timer" id="tm">--:--:--</div><div class="actions"><button class="btn pri" id="t0">'+(S.t0?'Đặt lại T0':'Bắt đầu T0')+'</button><button class="btn" id="sclr">Xóa đánh dấu</button></div><div id="tmw"></div></div>'+
 '<h2>Sơ đồ xử trí</h2><div class="flow" id="flow">'+SEP_STEPS.map((s,i)=>(i?'<div class="arr"></div>':'')+'<div class="node'+(sp[s[0]]?' on':'')+'"><label><input type="checkbox" data-k="'+s[0]+'" '+(sp[s[0]]?'checked':'')+'><span><b>'+(i+1)+'. '+esc(s[1])+'</b>'+(sp[s[0]]?' <span class="badge b-ok">'+esc(sp[s[0]])+'</span>':'')+'<small>'+esc(s[2])+'</small>'+(s[3]?'<a href="#'+s[3]+'" style="font-size:13px">Mở công cụ</a>':'')+'</span></label></div>').join('')+'</div>';
 h+='<h2>Dịch và lactate</h2><div class="card"><div class="form"><div class="fld"><label for="sw">Cân nặng (kg)</label><input id="sw" type="number" inputmode="decimal" value="'+esc(p.w)+'"></div><div class="fld"><label for="l1">Lactate ban đầu (mmol/L)</label><input id="l1" type="number" step="0.1" value="'+esc(sp.l1||'')+'"></div><div class="fld"><label for="l2">Lactate lặp lại (mmol/L)</label><input id="l2" type="number" step="0.1" value="'+esc(sp.l2||'')+'"></div></div><div id="fo"></div></div>';
 h+='<h2>Tính liều thuốc vận mạch</h2><div class="card"><div class="fld"><label for="vd">Thuốc</label><select id="vd">'+VASO.map(v=>'<option value="'+v.id+'">'+v.n+'</option>').join('')+'</select></div><div class="form" style="margin-top:10px"><div class="fld"><label for="vmg" id="vmgl">Lượng thuốc (mg)</label><input id="vmg" type="number" step="0.1"></div><div class="fld"><label for="vml">Pha trong (mL)</label><input id="vml" type="number"></div><div class="fld"><label for="vdose" id="vdl">Liều</label><input id="vdose" type="number" step="0.01"></div><div class="fld"><label for="vrate">Hoặc tốc độ bơm (mL/giờ)</label><input id="vrate" type="number" step="0.1"></div></div><div id="vo"></div></div>';
 shell(h);
 // timer
 let iv;const tick=()=>{const e=$('#tm');if(!e){clearInterval(iv);return;}if(!S.t0){e.textContent='--:--:--';return;}const s=Math.floor((Date.now()-S.t0)/1000);e.textContent=[s/3600,(s%3600)/60,s%60].map(x=>String(Math.floor(x)).padStart(2,'0')).join(':');$('#tmw').innerHTML=s>3600&&!sp.abx?'<div class="alert crit">Đã quá 1 giờ: kháng sinh chưa được đánh dấu.</div>':(!sp.abx?'<div class="alert warn">Sốc/khả năng cao: kháng sinh trong 1 giờ.</div>':'');};
 tick();iv=setInterval(tick,1000);
 $('#t0').onclick=()=>{S.t0=Date.now();save('t0');sepsis();};
 $('#sclr').onclick=()=>{S.sep={};save('sep');S.t0=null;save('t0');sepsis();};
 $('#flow').onchange=e=>{const k=e.target.dataset.k;if(!k)return;if(e.target.checked){const el=S.t0?Math.round((Date.now()-S.t0)/60000):null;sp[k]=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})+(el!=null?' · T0+'+el+' phút':'');}else delete sp[k];save('sep');const y=scrollY;sepsis();scrollTo(0,y);};
 const fo=()=>{const w=parseFloat($('#sw').value);const l1=parseFloat($('#l1').value),l2=parseFloat($('#l2').value);sp.l1=$('#l1').value;sp.l2=$('#l2').value;save('sep');
  let o='';if(w>0)o+='<div class="out"><div class="kv"><small>30 mL/kg (tham khảo SSC 2021)</small><b>'+fmt(30*w)+' <small>mL</small></b></div><div class="kv"><small>Mục tiêu nước tiểu</small><b>'+fmt(0.5*w,0)+' <small>mL/giờ</small></b></div>'+(l1>0&&l2>=0&&$('#l2').value!==''?'<div class="kv"><small>Thanh thải lactate</small><b>'+fmt((l1-l2)/l1*100,0)+' <small>%</small></b></div>':'')+'</div>';else o+='<div class="alert warn">Nhập cân nặng để tính thể tích dịch.</div>';
  if(l1>=4)o+='<div class="alert crit">Lactate ≥4 mmol/L: giảm tưới máu nặng – hồi sức tích cực, đánh giá lại sau 2–4 giờ.</div>';
  if(fOn('hf'))o+='<div class="alert crit">Suy tim: bù dịch theo từng liều nhỏ (250–500 mL) và đánh giá đáp ứng/quá tải sau mỗi liều; cân nhắc vận mạch sớm, siêu âm tim, dobutamin khi cung lượng thấp.</div>';
  if(fOn('renal')||fOn('hd'))o+='<div class="alert warn">Suy thận/lọc máu: nguy cơ quá tải dịch – theo dõi cân bằng dịch, phù phổi; cân nhắc lọc máu khi quá tải không đáp ứng lợi tiểu.</div>';
  o+='<div class="alert info">Quá tải dịch: dừng bù khi không còn đáp ứng; SSC 2026 gợi ý chủ động rút dịch sau giai đoạn hồi sức.</div>';
  $('#fo').innerHTML=o;};
 ['sw','l1','l2'].forEach(i=>$('#'+i).oninput=()=>{if(i==='sw'){p.w=$('#sw').value;save('pt');if($('#vd'))vcalc('dose');}fo();});fo();
 // vaso
 const vsel=()=>VASO.find(v=>v.id===$('#vd').value);
 const setV=()=>{const v=vsel();$('#vmg').value=v.mg;$('#vml').value=v.ml;$('#vdose').value=v.def;$('#vrate').value='';$('#vmgl').textContent=v.unitsMode?'Lượng thuốc (UI)':'Lượng thuốc (mg)';$('#vdl').textContent='Liều ('+v.u+')';vcalc('dose');};
 const vcalc=src=>{const v=vsel();const w=parseFloat(p.w);const amt=parseFloat($('#vmg').value),ml=parseFloat($('#vml').value);let o='';
  if(!(amt>0&&ml>0)){$('#vo').innerHTML='<div class="alert warn">Nhập lượng thuốc và thể tích pha.</div>';return;}
  const conc=v.unitsMode?amt/ml:amt*1000/ml;// µg/mL hoặc UI/mL
  if(!v.unitsMode&&!(w>0)){$('#vo').innerHTML='<div class="alert crit">Cần cân nặng (nhập ở mục Dịch và lactate) để tính theo µg/kg/phút.</div>';return;}
  let dose,rate;
  if(src==='rate'){rate=parseFloat($('#vrate').value);dose=v.unitsMode?rate*conc/60:rate*conc/60/w;$('#vdose').value=fmt(dose,3).replace(/\./g,'').replace(',','.');}
  else{dose=parseFloat($('#vdose').value);rate=v.unitsMode?dose*60/conc:dose*w*60/conc;$('#vrate').value=isFinite(rate)?rate.toFixed(1):'';}
  o+='<div class="out"><div class="kv"><small>Nồng độ</small><b>'+(v.unitsMode?fmt(conc,2)+' <small>UI/mL</small>':fmt(conc,1)+' <small>µg/mL</small>')+'</b></div><div class="kv"><small>Tốc độ bơm</small><b>'+fmt(rate,1)+' <small>mL/giờ</small></b></div><div class="kv"><small>Liều</small><b>'+fmt(dose,3)+' <small>'+v.u+'</small></b></div></div>';
  o+='<div class="tw"><table><thead><tr><th class="num">Liều ('+v.u+')</th><th class="num">mL/giờ</th></tr></thead><tbody>'+(v.unitsMode?[0.01,0.02,0.03,0.04]:v.id==='dobu'||v.id==='dopa'?[2.5,5,7.5,10,15,20]:[0.05,0.1,0.2,0.3,0.5,1]).map(x=>'<tr><td class="num">'+fmt(x,2)+'</td><td class="num">'+fmt(v.unitsMode?x*60/conc:x*w*60/conc,1)+'</td></tr>').join('')+'</tbody></table></div>';
  o+='<p class="muted">Khoảng liều: '+esc(v.range)+'. '+esc(v.note)+'</p>';
  if(fOn('hf')&&v.id!=='dobu')o+='<div class="alert warn">Suy tim: vận mạch tăng hậu tải; đánh giá chức năng tim, cân nhắc dobutamin/adrenalin khi cung lượng thấp.</div>';
  if(rate>0&&rate<0.5)o+='<div class="alert warn">Tốc độ rất thấp (<0,5 mL/giờ): cân nhắc pha loãng hơn để bơm chính xác.</div>';
  $('#vo').innerHTML=o;};
 $('#vd').onchange=setV;['vmg','vml','vdose'].forEach(i=>$('#'+i).oninput=()=>vcalc('dose'));$('#vrate').oninput=()=>vcalc('rate');setV();
}

function slMeta(k){const m=Object.assign({},SL[k]);if(k==='scr'){if(S.pt.unit==='mg'){Object.assign(m,{u:'mg/dL',min:0.3,max:13,st:0.1,def:1});}else m.u='µmol/L';}return m;}
function slRow(k){const m=slMeta(k);const v=S.pt[k];const has=v!==''&&v!=null;
 return '<div class="fr"><label for="sl-'+k+'">'+m.l+'</label><div class="sl2" data-sl="'+k+'"><button class="sm-b" data-d="-1" aria-label="Giảm">−</button><input type="range" id="sl-'+k+'" min="'+m.min+'" max="'+m.max+'" step="'+m.st+'" value="'+(has?Math.min(m.max,Math.max(m.min,+v)):m.def)+'"'+(has?'':' class="unset"')+'><button class="sm-b" data-d="1" aria-label="Tăng">+</button><input class="v" type="number" inputmode="decimal" step="'+m.st+'" value="'+(has?esc(v):'')+'" placeholder="—" aria-label="'+m.l+' ('+m.u+')"><button class="x" data-x="1" aria-label="Xóa">×</button></div></div>';}
function optRow(label,key,opts,cur){return '<div class="fr"><label>'+label+'</label><div class="opt" data-o="'+key+'">'+opts.map(o=>'<button data-v="'+o[0]+'" class="'+(cur===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</div></div>';}
function tabPt(id,c){
 const d=DZ[id];const sel=S.sel[id]||(S.sel[id]={rk:{}});
 let L='<div class="pf"><h4>Dữ kiện riêng — '+esc(d.n)+'</h4>'+
 '<div class="fr"><label>Tình huống / mức độ</label><div class="opt" data-lv="1">'+d.lv.map((l,i)=>'<button data-i="'+i+'" class="'+(sel.lv===i?'on':'')+'">'+esc(l.n)+'</button>').join('')+'</div></div>'+
 '<div class="fr"><label>Nguy cơ kháng thuốc</label><div class="opt" data-rk="1">'+(d.rk||[]).map(k=>'<button data-k="'+k+'" class="'+(sel.rk[k]?'on':'')+'">'+esc(RK[k].n.replace(/^Nguy cơ /,''))+'</button>').join('')+
 '<button data-f="recentabx" class="'+(fOn('recentabx')?'on':'')+'">KS 90 ngày</button><button data-f="mdrhx" class="'+(fOn('mdrhx')?'on':'')+'">Tiền sử VK kháng</button><button data-f="immuno" class="'+(fOn('immuno')?'on':'')+'">Suy giảm miễn dịch</button><button data-none="1" class="ok '+(sel.rkDone?'on':'')+'">Không có</button></div></div>'+
 (S.mode==='deep'&&sel.lv!=null&&d.lv[sel.lv].d?'<p class="note">'+esc(d.lv[sel.lv].d)+'</p>':'')+
 '<h4>Đặc điểm bệnh nhân</h4>'+
 optRow('Dị ứng kháng sinh','allergy',Q[0].o,S.ans.allergy)+optRow('Chức năng thận','renal',[['ok','Bình thường'],['low','Suy thận'],['hd','Lọc ngắt quãng'],['crrt','CRRT'],['auto','Tính theo creatinin']],S.ans.renal)+
 optRow('Chức năng gan','liver',Q[2].o,S.ans.liver)+optRow('Thai kỳ','preg',[['no','Không / nam'],['yes','Đang mang thai']],S.ans.preg)+
 '<div class="fr"><label>Khác</label><div class="opt" data-fx="1">'+[['qt','Nguy cơ QT'],['anticoag','Chống đông'],['dm','ĐTĐ'],['hf','Suy tim']].map(f=>'<button data-f="'+f[0]+'" class="'+(fOn(f[0])?'on':'')+'">'+f[1]+'</button>').join('')+'</div></div>'+
 '<h4>Nhân trắc & chức năng thận</h4>'+optRow('Giới','sex',[['m','Nam'],['f','Nữ']],S.pt.sex)+slRow('age')+slRow('w')+slRow('h')+slRow('scr')+optRow('Đơn vị creatinin','unit',[['umol','µmol/L'],['mg','mg/dL']],S.pt.unit)+
 '<div class="derv" id="derv"></div><button class="ib" id="newpt">Bệnh nhân mới</button></div>';
 c.innerHTML='<h3 class="tabh">Lựa chọn tình trạng bệnh nhân</h3><div class="pt">'+L+'<div class="res" id="res"></div></div><div class="mbar" id="mbar"></div>';
 const re=()=>keepScroll(()=>tabPt(id,c));
 c.querySelector('.pf').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  const lvG=b.closest('[data-lv]'),rkG=b.closest('[data-rk]'),oG=b.closest('[data-o]'),fx=b.closest('[data-fx]'),sl=b.closest('[data-sl]');
  if(lvG){sel.lv=+b.dataset.i;}
  else if(rkG){if(b.dataset.none){sel.rkDone=!sel.rkDone;if(sel.rkDone){sel.rk={};['recentabx','mdrhx','immuno'].forEach(k=>S.flt[k]=false);}}else if(b.dataset.f){S.flt[b.dataset.f]=!fOn(b.dataset.f);if(S.flt[b.dataset.f])sel.rkDone=false;}else{sel.rk[b.dataset.k]=!sel.rk[b.dataset.k];if(sel.rk[b.dataset.k])sel.rkDone=false;}}
  else if(oG){const k=oG.dataset.o,v=b.dataset.v;if(k==='sex'||k==='unit'){if(k==='unit'&&S.pt.unit!==v&&S.pt.scr!==''){S.pt.scr=v==='mg'?String(Math.round(S.pt.scr/88.4*100)/100):String(Math.round(S.pt.scr*88.4));}S.pt[k]=v;}else{S.ans[k]=v;}syncAns2();}
  else if(fx){S.flt[b.dataset.f]=!fOn(b.dataset.f);}
  else if(sl){const k=sl.dataset.sl,m=slMeta(k);if(b.dataset.x){S.pt[k]='';}else{const cur=S.pt[k]===''?m.def:+S.pt[k];S.pt[k]=String(Math.round((cur+(+b.dataset.d)*m.st)*100)/100);}syncAns2();}
  else if(b.id==='newpt'){newPatient();toast('Đã xóa dữ liệu bệnh nhân');}
  else return;
  re();};
 c.querySelectorAll('.sl2').forEach(r=>{const k=r.dataset.sl;const rg=r.querySelector('input[type=range]'),nv=r.querySelector('input.v');
  rg.oninput=()=>{S.pt[k]=rg.value;nv.value=rg.value;rg.classList.remove('unset');syncAns2();renderRes(id);};
  nv.oninput=()=>{S.pt[k]=nv.value;if(nv.value!=='')rg.value=nv.value;rg.classList.toggle('unset',nv.value==='');syncAns2();renderRes(id);};});
 renderRes(id);
}
function syncAns2(){const a=S.ans;if(a.renal==='auto'){const r=ptCalc();S.flt.renal=r.crcl!=null&&r.crcl<50;S.flt.hd=false;S.pt.mode='none';}else syncAns();}
function renalState(){const a=S.ans.renal;if(a!=='auto')return a;const r=ptCalc();return r.crcl==null?'unk':(r.crcl<50?'low':'ok');}
function missing(id){
 const sel=S.sel[id]||{};const m=[];
 if(sel.lv==null)m.push(['lv','Tình huống / mức độ']);
 if(!sel.rkDone&&!Object.values(sel.rk||{}).some(Boolean)&&!fOn('recentabx')&&!fOn('mdrhx')&&!fOn('immuno'))m.push(['rk','Nguy cơ kháng thuốc (hoặc chọn “Không có”)']);
 if(!S.ans.allergy)m.push(['q','Dị ứng kháng sinh']);
 const rs=S.ans.renal?renalState():null;if(!rs)m.push(['q','Chức năng thận']);else if(rs==='unk')m.push(['q','Creatinin, tuổi, cân nặng (để tính CrCl)']);
 if(!S.ans.liver)m.push(['q','Chức năng gan']);if(!S.ans.preg)m.push(['q','Thai kỳ']);
 return m;
}
function rc(cls,title,body,why,need){return '<div class="rc '+cls+'"><b>'+title+'</b>'+(body?'<div>'+body+'</div>':'')+(why?'<div class="why">'+why+'</div>':'')+(need?'<div class="need">Cần bổ sung: '+esc(need)+'</div>':'')+'</div>';}
function renderRes(id){
 const d=DZ[id];const sel=S.sel[id];const o=$('#res');if(!o)return;
 const r=ptCalc();const dv=$('#derv');if(dv)dv.innerHTML=(r.crcl!=null?'<span>CrCl '+fmt(r.crcl,0)+' mL/ph</span>':'')+(r.egfr!=null?'<span>eGFR '+fmt(r.egfr,0)+'</span>':'')+(r.ibw?'<span>IBW '+fmt(r.ibw,1)+' kg</span>':'')+(r.bmi?'<span>BMI '+fmt(r.bmi,1)+'</span>':'')+(S.ans.renal==='auto'&&r.crcl!=null?'<span>Thận: '+(r.crcl<50?'suy (CrCl <50)':'CrCl ≥50')+'</span>':'');
 let h='<h4 style="margin-top:0">Phương án tham khảo theo dữ kiện</h4><div class="legend"><span class="tag red">Cấp cứu</span><span class="tag orange">Thận trọng / nguy cơ kháng</span><span class="tag green">Ưu tiên</span><span class="tag blue">Thay thế</span><span class="tag gray">Chưa đủ dữ kiện / không dùng</span></div>';
 if(EMTXT[id])h+=rc('red','Cấp cứu',esc(EMTXT[id]));
 const miss=missing(id);const cnt={red:EMTXT[id]?1:0,orange:0,green:0,gray:0};
 if(miss.length){h+=rc('gray','Chưa hiển thị phác đồ','Hệ thống không mặc định các dữ kiện chưa nhập; mọi phương án đang ở trạng thái xám.','',miss.map(x=>x[1]).join(', '));cnt.gray++;
  (d.rk||[]).forEach(k=>{if(sel&&sel.rk[k])h+=rc('orange',RK[k].n,'','Đã chọn – sẽ đưa vào phác đồ khi đủ dữ kiện');});
 }else{
  const lv=d.lv[sel.lv];const al=lv.al||DEF.al;const a=S.ans.allergy;
  const why=lv.n+(lv.d&&S.mode==='deep'?' · '+lv.d:'');
  const line=(x)=>linkify(x)+renalNote(x);
  if(a==='anaph'){h+=rc('green','Ưu tiên – phản vệ β-lactam',line(al.s),why);cnt.green++;lv.rx.forEach(x=>{h+=rc('gray','Không dùng (chứa β-lactam)',linkify(x));cnt.gray++;});}
  else{lv.rx.forEach((x,i)=>{h+=rc('green','Ưu tiên'+(lv.rx.length>1?' '+(i+1):''),line(x),why);cnt.green++;});if(a==='mild'){h+=rc('orange','Khi dị ứng penicillin không nặng',line(al.m));cnt.orange++;}}
  (d.rk||[]).forEach(k=>{if(sel.rk[k]){RK[k].rx.forEach(x=>{h+=rc('orange',RK[k].n,line(x),RK[k].nt||'');cnt.orange++;});}});
  (lv.alt||[]).forEach(x=>{h+=rc('blue','Thay thế',line(x));});
  h+=rc('blue','Thời gian điều trị',esc(lv.dur||d.dur));
  if(lv.nt)h+=rc('blue','Lưu ý',linkify(lv.nt));
  if(d.sc){h+=rc(EMER.includes(id)?'red':'orange','Kiểm soát ổ nhiễm',esc(d.sc));cnt.orange++;}
  const ids=drugsIn([a==='anaph'?al.s:lv.rx.join(' '),a==='mild'?al.m:''].concat(...(d.rk||[]).filter(k=>sel.rk[k]).map(k=>RK[k].rx)).join(' '));
  warnings(ids).forEach(w=>{h+=rc(w[0]==='crit'?'red':w[0]==='warn'?'orange':'gray',w[0]==='crit'?'Cảnh báo nghiêm trọng':w[0]==='warn'?'Thận trọng':'Thông tin',esc(w[1]));cnt[w[0]==='crit'?'red':w[0]==='warn'?'orange':'gray']++;});
  h+='<div class="actions"><a class="btn pri" href="#d-'+id+'--abx">Bảng phác đồ chi tiết</a><a class="btn" href="#d-'+id+'--mon">Theo dõi sau '+esc((MON[id]||MON_DEF).t.split(' (')[0])+'</a></div>';
 }
 h+='<p class="note">Chế độ: '+({quick:'Tra cứu nhanh',em:'Cấp cứu nhanh',deep:'Học chuyên sâu'})[S.mode||'quick']+'. Đối chiếu kháng sinh đồ tích lũy của bệnh viện.</p>';
 o.innerHTML=h;
 const mb=$('#mbar');if(mb)mb.innerHTML='<span class="tag red">'+cnt.red+'</span><span class="tag orange">'+cnt.orange+'</span><span class="tag green">'+cnt.green+'</span><span class="tag gray">'+cnt.gray+'</span><button class="btn" id="goRes">Xem phương án ↓</button>';
 const g=$('#goRes');if(g)g.onclick=()=>{const t=$('#res');if(t)t.scrollIntoView({behavior:'smooth',block:'start'});};
}
function renalNote(text){const rs=S.ans.renal?renalState():null;if(!rs||rs==='ok')return '';const ids=drugsIn(text);const r=ptCalc();
 const parts=ids.map(x=>{const dr=DRUG_BY_ID[x];if(rs==='hd')return dr.n+' – lọc máu: '+dr.hd;if(rs==='crrt')return dr.n+' – CRRT: '+dr.crrt;if(rs==='low'){if(r.crcl!=null){const b=band(dr,r.crcl);return b===dr.renal[0]?'':dr.n+' (CrCl '+fmt(r.crcl,0)+'): '+b[2];}return dr.renal.length>1?dr.n+': cần chỉnh theo CrCl (nhập creatinin)':'';}return '';}).filter(Boolean);
 return parts.length?'<div class="why" style="color:var(--hi)">Chỉnh liều thận: '+esc(parts.join(' · '))+'</div>':'';}
function tabAbx(id,c){
 const miss=missing(id);
 c.innerHTML='<h3 class="tabh">Bảng phác đồ kháng sinh</h3>'+(miss.length?'<div class="alert warn"><b>Cần bổ sung trước khi hiển thị phác đồ:</b> '+esc(miss.map(x=>x[1]).join(', '))+'. <a href="#d-'+id+'--pt">Mở tab Tình trạng BN</a></div>':'')+'<div id="rxo"></div>'+(S.mode==='deep'?'<h4>Toàn bộ tình huống của bệnh</h4><div class="tw"><table class="rt"><thead><tr><th>Tình huống</th><th>Ưu tiên</th><th>Thay thế</th><th>Thời gian</th></tr></thead><tbody>'+DZ[id].lv.map(l=>'<tr><td data-l="Tình huống"><b>'+esc(l.n)+'</b></td><td data-l="Ưu tiên">'+l.rx.map(linkify).join('<br>')+'</td><td data-l="Thay thế">'+(l.alt||[]).map(linkify).join('<br>')+'</td><td data-l="Thời gian">'+esc(l.dur||'')+'</td></tr>').join('')+'</tbody></table></div>':'');
 if(!miss.length)renderRx(id);
}

function notFound(){shell('<h1>Không tìm thấy trang</h1><a class="btn pri" href="#home">Về trang chủ</a>');}

/* ---------- định tuyến ---------- */
function route(){
 const hsh=decodeURIComponent(location.hash.slice(1))||'home';
 const m=(p)=>hsh.startsWith(p)?hsh.slice(p.length):null;
 let x;
 if(hsh==='home')home();
 else if(hsh==='emergency')emergency();
 else if((x=m('g-'))!=null)group(x);
 else if((x=m('d-'))!=null){const pp=x.split('--');disease(pp[0],pp[1]);}
 else if((x=m('src-'))!=null)disease(x,'ref');
 else if(hsh==='spectrum')spectrum();
 else if((x=m('drug-'))!=null)drug(x);
 else if(hsh==='drugs')drugs();
 else if(hsh==='compare')compare();
 else if(hsh==='dose')dose();
 else if((x=m('dose-'))!=null)dose(x);
 else if(hsh==='prep')prep();
 else if((x=m('prep-'))!=null)prep(x);
 else if(hsh==='scores')scores();
 else if((x=m('s-'))!=null)score(x);
 else if(hsh==='mdr')mdr();
 else if((x=m('mdr-'))!=null)mdr(x);
 else if(hsh==='patient')patient();
 else if(hsh==='hospital')hospital();
 else if(hsh==='sepsis')sepsis();
 else if(hsh==='sources')sources();
 else notFound();
}
window.addEventListener('hashchange',route);
syncAbg(store.get('abgT',{}));
route();
window.__ABX={ptCalc,doseCalc,findDrugs,warnings,S};
})();

</script>
